<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UBU Tracking</title>


<style>

body{
font-family:Arial,sans-serif;
background:#f2f6f8;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.box{
background:white;
width:350px;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px #ccc;
}


h1{
text-align:center;
color:#087f73;
}


input,select,textarea{

width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ddd;
box-sizing:border-box;

}


button{

width:100%;
padding:14px;
margin-top:15px;
background:#10b981;
color:white;
border:none;
border-radius:8px;
font-size:16px;

}


#problem{
display:none;
}


</style>


</head>


<body>



<div class="box" id="login">


<h1>UBU Tracking</h1>


<p style="text-align:center">
ระบบแจ้งปัญหาสำหรับนักศึกษา
</p>


<input id="student"
placeholder="รหัสนักศึกษา">


<button onclick="login()">
เข้าสู่ระบบ
</button>


</div>






<div class="box" id="problem">


<h1>
แจ้งปัญหา
</h1>


<p>
รหัสนักศึกษา :
<span id="showID"></span>
</p>




<select id="category">

<option value="">
เลือกประเภทปัญหา
</option>

<option>
ห้องเรียน
</option>

<option>
อินเทอร์เน็ต
</option>

<option>
หอพัก
</option>

<option>
อุปกรณ์
</option>

<option>
อื่นๆ
</option>

</select>




<textarea 
id="detail"
rows="5"
placeholder="รายละเอียดปัญหา">
</textarea>




<button onclick="sendProblem()">

ส่งแจ้งปัญหา

</button>


</div>





<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


// ==========================
// ใส่ค่าของคุณตรงนี้
// ==========================


const SUPABASE_URL =
"https://ใส่-project-url.supabase.co";


const SUPABASE_ANON_KEY =
"ใส่-anon-public-key";




// สร้าง Client


const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);





// LOGIN


function login(){


let id =
document.getElementById("student").value.trim();



if(id===""){

alert("กรุณากรอกรหัสนักศึกษา");

return;

}



document.getElementById("login").style.display="none";


document.getElementById("problem").style.display="block";


document.getElementById("showID").textContent=id;


}





// ส่งข้อมูล


async function sendProblem(){



let student =
document.getElementById("showID").textContent;



let category =
document.getElementById("category").value;



let detail =
document.getElementById("detail").value.trim();





if(category===""){

alert("กรุณาเลือกประเภทปัญหา");

return;

}



if(detail===""){

alert("กรุณากรอกรายละเอียด");

return;

}






try{


const {data,error}=await client

.from("problems")

.insert([

{

student_id:student,

category:category,

detail:detail,

status:"รอดำเนินการ"

}

]);





if(error){

console.log(error);

alert(
"ส่งไม่สำเร็จ : "
+ error.message
);

return;

}



alert("ส่งแจ้งปัญหาสำเร็จ");



// ล้างข้อมูล

document.getElementById("detail").value="";


}



catch(err){


console.log(err);


alert(
"เชื่อมต่อฐานข้อมูลไม่ได้"
);


}



}



</script>


</body>

</html>
