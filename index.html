<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>UBU Tracking</title>


<style>

body{

font-family:Arial,sans-serif;
background:#f2f6f8;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;

}


.box{

background:white;
width:350px;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px #ccc;

}


h1{

text-align:center;
color:#087f73;

}


input,select,textarea{

width:100%;
padding:12px;
margin-top:10px;
border-radius:8px;
border:1px solid #ddd;
box-sizing:border-box;

}



button{

width:100%;
padding:14px;
margin-top:15px;
background:#10b981;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;

}



button:hover{

background:#059669;

}



#problem{

display:none;

}


</style>

</head>


<body>



<div class="box" id="login">


<h1>UBU Tracking</h1>


<p align="center">
ระบบแจ้งปัญหาสำหรับนักศึกษา
</p>


<input 
id="student"
placeholder="รหัสนักศึกษา">


<button onclick="login()">

เข้าสู่ระบบ

</button>


</div>





<div class="box" id="problem">


<h1>
แจ้งปัญหา
</h1>


<p>
รหัสนักศึกษา :
<span id="showID"></span>
</p>




<select id="category">

<option value="">
เลือกประเภทปัญหา
</option>

<option value="ห้องเรียน">
ห้องเรียน
</option>

<option value="อินเทอร์เน็ต">
อินเทอร์เน็ต
</option>

<option value="หอพัก">
หอพัก
</option>

<option value="อุปกรณ์">
อุปกรณ์
</option>

<option value="อื่นๆ">
อื่นๆ
</option>


</select>




<textarea
id="detail"
rows="5"
placeholder="รายละเอียดปัญหา">

</textarea>



<button onclick="sendProblem()">

ส่งแจ้งปัญหา

</button>



</div>





<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>



<script>


// =============================
// ใส่ข้อมูล Supabase ของจริง
// =============================


const SUPABASE_URL =
"https://zorgenrnjbwnzsnwalek.supabase.co";


const SUPABASE_KEY =
"sb_publishable_QHcqpDWzdd1ysgy_g0Eo1A_Epo-WVj9";


// ตรวจสอบ Supabase


let db = null;


if(
SUPABASE_URL.includes("supabase.co")
&&
!SUPABASE_KEY.includes("ใส่")
){

db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

}




let currentStudent="";



// LOGIN


function login(){


let id =
document.getElementById("student")
.value
.trim();



if(id.length < 5){

alert("กรุณากรอกรหัสนักศึกษาให้ถูกต้อง");

return;

}



currentStudent=id;



document.getElementById("showID")
.textContent=id;



document.getElementById("login")
.style.display="none";


document.getElementById("problem")
.style.display="block";



}




// ส่งข้อมูล


async function sendProblem(){


let category =
document.getElementById("category")
.value;



let detail =
document.getElementById("detail")
.value
.trim();



if(category===""){

alert("กรุณาเลือกประเภทปัญหา");

return;

}



if(detail===""){

alert("กรุณากรอกรายละเอียด");

return;

}




if(db===null){

alert(
"ยังไม่ได้เชื่อมต่อ Supabase"
);

return;

}




let data={


student_id:currentStudent,

category:category,

detail:detail,

status:"รอดำเนินการ",

created_at:
new Date()


};





const {error}=await db

.from("problems")

.insert([data]);





if(error){


alert(
"เกิดข้อผิดพลาด : "
+
error.message
);


console.log(error);

return;


}



alert(
"แจ้งปัญหาสำเร็จ"
);



document.getElementById("detail")
.value="";


document.getElementById("category")
.value="";


}




</script>


</body>

</html>
