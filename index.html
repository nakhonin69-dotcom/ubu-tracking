<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBU Tracking</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f2f6f8;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.box{
    background:white;
    width:350px;
    padding:30px;
    border-radius:20px;
    box-shadow:0 5px 20px #ccc;
}

h1{
    text-align:center;
    color:#087f73;
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:8px;
    border:1px solid #ddd;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:#10b981;
    color:white;
    border:0;
    border-radius:8px;
    font-size:16px;
}

#problem{
    display:none;
}
</style>

</head>

<body>


<div class="box" id="login">

<h1>UBU Tracking</h1>

<p style="text-align:center">
ระบบแจ้งปัญหาสำหรับนักศึกษา
</p>

<input id="student"
placeholder="รหัสนักศึกษา">

<button onclick="login()">
เข้าสู่ระบบ
</button>

</div>



<div class="box" id="problem">

<h1>แจ้งปัญหา</h1>

<p>
รหัสนักศึกษา:
<span id="showID"></span>
</p>


<select>
<option>เลือกประเภทปัญหา</option>
<option>ห้องเรียน</option>
<option>อินเทอร์เน็ต</option>
<option>หอพัก</option>
<option>อุปกรณ์</option>
<option>อื่นๆ</option>
</select>


<textarea rows="5"
placeholder="รายละเอียดปัญหา">
</textarea>


<button>
ส่งแจ้งปัญหา
</button>


</div>



<script>

const supabaseUrl = "https://zorgnnjbzwmszwak.supabase.co";
const supabaseKey = "sb_publishable_QHcqDWzdd1ysgy_gEo1A_Epo-Wj9";

const client = window.supabase.createClient(
  supabaseUrl,
  supabaseKey
);


function login(){

let id=document.getElementById("student").value;

if(id==""){
alert("กรุณากรอกรหัสนักศึกษา");
return;
}

document.getElementById("login").style.display="none";

document.getElementById("problem").style.display="block";

document.getElementById("showID").innerHTML=id;

}

    async function sendProblem(){

let student = document.getElementById("showID").innerHTML;
let category = document.querySelector("select").value;
let detail = document.querySelector("textarea").value;

const { data, error } = await client
.from("problems")
.insert([
{
student_id: student,
category: category,
detail: detail,
status:"รอดำเนินการ"
}
]);

if(error){
alert("ส่งข้อมูลไม่สำเร็จ");
console.log(error);
}else{
alert("ส่งปัญหาสำเร็จ");
}

}
</script>


</body>
</html>
